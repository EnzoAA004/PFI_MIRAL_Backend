name: Backend CI

# Sin filtro de rama en push: una rama de feature tiene que ver el CI antes del merge.
on:
  push:
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gate: catches compile errors in ~30s without waiting for the full suite.
  # There is no unit/integration Surefire tag split in this project today, so this
  # job is compile-only rather than an invented "unit" subset.
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -B -DskipTests compile

  # Authoritative gate: the full suite (1070 tests en integration/final-2026, ~2 minutos en local).
  test:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` y no `test`: es la fase donde JaCoCo genera el reporte, una vez que
      # surefire termino de escribir jacoco.exec. Ademas verifica que el jar se arme, que
      # antes no se comprobaba en ningun lado aunque el Dockerfile dependa de eso.
      - name: Run tests with coverage
        run: mvn verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

      # El porcentaje tiene que verse sin descargar nada: va al summary del job.
      # Se lee el CSV de JaCoCo, que es la fuente de la verdad del mismo reporte HTML.
      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "No se genero $CSV" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$CSV" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv, sys
          from collections import defaultdict

          pkgs, total = defaultdict(lambda: defaultdict(int)), defaultdict(int)
          keys = ("INSTRUCTION_MISSED", "INSTRUCTION_COVERED", "BRANCH_MISSED",
                  "BRANCH_COVERED", "LINE_MISSED", "LINE_COVERED")
          with open(sys.argv[1], newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  pkg = row["PACKAGE"].replace("ar.edu.uade.pfi.backend", "").lstrip(".") or "(raiz)"
                  for k in keys:
                      pkgs[pkg][k] += int(row[k]); total[k] += int(row[k])

          def pct(c, m):
              d = c + m
              return f"{100.0 * c / d:.1f}%" if d else "n/a"

          lt = total["LINE_COVERED"] + total["LINE_MISSED"]
          bt = total["BRANCH_COVERED"] + total["BRANCH_MISSED"]
          print("## Cobertura del backend\n")
          print(f"**Lineas: {pct(total['LINE_COVERED'], total['LINE_MISSED'])}** "
                f"({total['LINE_COVERED']}/{lt}) &nbsp;&nbsp; "
                f"**Ramas: {pct(total['BRANCH_COVERED'], total['BRANCH_MISSED'])}** "
                f"({total['BRANCH_COVERED']}/{bt})\n")
          print("| Paquete | Lineas | Ramas | Cubiertas/Total |")
          print("|---|---:|---:|---:|")
          rows = sorted(pkgs.items(), key=lambda kv: -(kv[1]["LINE_COVERED"] + kv[1]["LINE_MISSED"]))
          for pkg, m in rows:
              n = m["LINE_COVERED"] + m["LINE_MISSED"]
              print(f"| `{pkg}` | {pct(m['LINE_COVERED'], m['LINE_MISSED'])} "
                    f"| {pct(m['BRANCH_COVERED'], m['BRANCH_MISSED'])} | {m['LINE_COVERED']}/{n} |")
          print("\nReporte HTML completo: artifact `jacoco-report`.")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14

  # Validates the Dockerfile actually builds — never pushed anywhere from CI at this
  # stage (a dedicated publish stage, if/when adopted, is the one that starts pushing
  # to a registry; deliberately not wired up here as part of this reconciliation).
  docker-build:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (validation only, never pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pfi-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
