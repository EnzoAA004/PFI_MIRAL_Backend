name: CLOUD-03 Publish Image (Backend)

# Manual only, on purpose (CLOUD-03 instruction): no push/pull_request
# trigger, so no accidental or fork-originated run can ever obtain a WIF
# token. A human with write access to this repo must explicitly run this
# from the Actions tab (or `gh workflow run`).
on:
  workflow_dispatch: {}

concurrency:
  group: cloud-03-publish-backend
  cancel-in-progress: false

# Only what's needed: id-token to mint the OIDC token WIF exchanges, and
# read-only checkout. No packages/contents/actions write.
permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No service-account JSON key anywhere -- this exchanges the job's own
      # OIDC token for a short-lived GCP access token via Workload Identity
      # Federation, impersonating the dedicated push-only service account.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ARTIFACT_PUSH_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (tagged by git SHA, never :latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
