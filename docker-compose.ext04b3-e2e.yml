services:
  postgres:
    image: postgres:16-alpine
    container_name: pfi-ext04b3-postgres
    environment:
      POSTGRES_DB: pfi_ext04b3
      POSTGRES_USER: pfi_ext04b3
      POSTGRES_PASSWORD: pfi_ext04b3_local_only
    ports:
      - "55415:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfi_ext04b3 -d pfi_ext04b3"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pfi-ext04b3-postgres-data:/var/lib/postgresql/data
    networks:
      - pfi-ext04b3-e2e

  mock-ai:
    build:
      context: ./docker/post-e50-mocks
    container_name: pfi-ext04b3-mock-ai
    command: ["node", "mock-ai.mjs"]
    environment:
      PORT: 8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - pfi-ext04b3-e2e

  backend:
    build:
      context: .
    container_name: pfi-ext04b3-backend
    depends_on:
      postgres:
        condition: service_healthy
      mock-ai:
        condition: service_healthy
    environment:
      PORT: 8080
      PFI_PERSISTENCE_MODE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/pfi_ext04b3?sslmode=disable&user=pfi_ext04b3&password=pfi_ext04b3_local_only
      PFI_AUTH_DEMO_ENABLED: "true"
      PFI_AUTH_JWT_SECRET: pfi-ext04b3-local-jwt-secret-only
      PFI_CORS_ALLOWED_ORIGINS: http://localhost:8388,http://127.0.0.1:8388
      PFI_LLM_ENABLED: "false"
      PFI_AI_SERVICE_URL: http://mock-ai:8000
      PFI_AI_TIMEOUT_SECONDS: 5
    ports:
      - "8380:8080"
    networks:
      - pfi-ext04b3-e2e

  frontend:
    build:
      context: ../PFI_MVPTest_Enzo_Frontend_ext04b3
      args:
        VITE_API_BASE_URL: http://localhost:8380
    container_name: pfi-ext04b3-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://localhost:8380
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s\n' 'window.__PFI_CONFIG__ = {"API_BASE_URL":"http://localhost:8380"};' > /usr/share/nginx/html/env.js
        exec nginx -g 'daemon off;'
    ports:
      - "8388:80"
    networks:
      - pfi-ext04b3-e2e

networks:
  pfi-ext04b3-e2e:
    name: pfi-ext04b3-e2e

volumes:
  pfi-ext04b3-postgres-data:
    name: pfi-ext04b3-postgres-data
