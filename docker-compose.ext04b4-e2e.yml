services:
  postgres:
    image: postgres:16-alpine
    container_name: pfi-ext04b4-postgres
    environment:
      POSTGRES_DB: pfi_ext04b4
      POSTGRES_USER: pfi_ext04b4
      POSTGRES_PASSWORD: pfi_ext04b4_local_only
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfi_ext04b4 -d pfi_ext04b4"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pfi-ext04b4-postgres-data:/var/lib/postgresql/data
    networks:
      - pfi-ext04b4-e2e

  mock-ai:
    build:
      context: ./docker/post-e50-mocks
    container_name: pfi-ext04b4-mock-ai
    command: ["node", "mock-ai.mjs"]
    environment:
      PORT: 8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - pfi-ext04b4-e2e

  backend:
    build:
      context: .
    container_name: pfi-ext04b4-backend
    depends_on:
      postgres:
        condition: service_healthy
      mock-ai:
        condition: service_healthy
    environment:
      PORT: 8080
      PFI_PERSISTENCE_MODE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/pfi_ext04b4?sslmode=disable&user=pfi_ext04b4&password=pfi_ext04b4_local_only
      PFI_AUTH_DEMO_ENABLED: "true"
      PFI_AUTH_JWT_SECRET: pfi-ext04b4-local-jwt-secret-only
      PFI_CORS_ALLOWED_ORIGINS: http://localhost:8588
      PFI_LLM_ENABLED: "false"
      PFI_AI_SERVICE_URL: http://mock-ai:8000
      PFI_AI_TIMEOUT_SECONDS: 5
    ports:
      - "8580:8080"
    networks:
      - pfi-ext04b4-e2e

networks:
  pfi-ext04b4-e2e:
    name: pfi-ext04b4-e2e

volumes:
  pfi-ext04b4-postgres-data:
    name: pfi-ext04b4-postgres-data
