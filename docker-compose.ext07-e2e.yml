services:
  postgres:
    image: postgres:16-alpine
    container_name: pfi-ext07-postgres
    environment:
      POSTGRES_DB: pfi_ext07
      POSTGRES_USER: pfi_ext07
      POSTGRES_PASSWORD: pfi_ext07_local_only
    ports:
      - "55425:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfi_ext07 -d pfi_ext07"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pfi-ext07-postgres-data:/var/lib/postgresql/data
    networks:
      - pfi-ext07-e2e

  mock-ai:
    build:
      context: ./docker/post-e50-mocks
    container_name: pfi-ext07-mock-ai
    command: ["node", "mock-ai.mjs"]
    environment:
      PORT: 8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - pfi-ext07-e2e

  backend:
    build:
      context: .
    container_name: pfi-ext07-backend
    depends_on:
      postgres:
        condition: service_healthy
      mock-ai:
        condition: service_healthy
    environment:
      PORT: 8080
      PFI_PERSISTENCE_MODE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/pfi_ext07?sslmode=disable&user=pfi_ext07&password=pfi_ext07_local_only
      PFI_AUTH_DEMO_ENABLED: "true"
      PFI_AUTH_JWT_SECRET: pfi-ext07-local-jwt-secret-only
      PFI_CORS_ALLOWED_ORIGINS: http://localhost:8488,http://127.0.0.1:8488
      PFI_LLM_ENABLED: "false"
      PFI_AI_SERVICE_URL: http://mock-ai:8000
      PFI_AI_TIMEOUT_SECONDS: 5
    ports:
      - "8480:8080"
    networks:
      - pfi-ext07-e2e

  frontend:
    build:
      context: ../PFI_MVPTest_Enzo_Frontend_ext07
      args:
        VITE_API_BASE_URL: http://localhost:8480
    container_name: pfi-ext07-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://localhost:8480
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s\n' 'window.__PFI_CONFIG__ = {"API_BASE_URL":"http://localhost:8480"};' > /usr/share/nginx/html/env.js
        exec nginx -g 'daemon off;'
    ports:
      - "8488:80"
    networks:
      - pfi-ext07-e2e

networks:
  pfi-ext07-e2e:
    name: pfi-ext07-e2e

volumes:
  pfi-ext07-postgres-data:
    name: pfi-ext07-postgres-data
