services:
  postgres:
    image: postgres:16-alpine
    container_name: pfi-final-e2e-postgres
    environment:
      POSTGRES_DB: ${FINAL_E2E_POSTGRES_DB:-pfi_final_e2e}
      POSTGRES_USER: ${FINAL_E2E_POSTGRES_USER:-pfi_final}
      POSTGRES_PASSWORD: ${FINAL_E2E_POSTGRES_PASSWORD:-change-me-final-e2e-local-only}
    expose:
      - "5432"
    volumes:
      - pfi-final-e2e-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pfi-final-e2e

  ai:
    build:
      context: ../PFI_MVPTest_Enzo_AImodule_final_integration
    image: pfi-final-e2e-ai:local
    container_name: pfi-final-e2e-ai
    environment:
      PORT: 8000
      PFI_OUTPUT_DIR: /app/outputs
      PFI_MODEL_DIR: /app/models/final
    expose:
      - "8000"
    volumes:
      - pfi-final-e2e-ai-outputs:/app/outputs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - pfi-final-e2e

  mock-llm:
    build:
      context: ./docker/post-e50-mocks
    image: pfi-final-e2e-mock-llm:local
    container_name: pfi-final-e2e-mock-llm
    command: ["node", "mock-llm.mjs"]
    environment:
      PORT: 8001
      MOCK_LLM_MODE: ${FINAL_E2E_MOCK_LLM_MODE:-normal}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8001/v1/models >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 5s
    networks:
      - pfi-final-e2e

  backend:
    build:
      context: .
    image: pfi-final-e2e-backend:local
    container_name: pfi-final-e2e-backend
    environment:
      PORT: 8080
      PFI_PERSISTENCE_MODE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/${FINAL_E2E_POSTGRES_DB:-pfi_final_e2e}?user=${FINAL_E2E_POSTGRES_USER:-pfi_final}&password=${FINAL_E2E_POSTGRES_PASSWORD:-change-me-final-e2e-local-only}
      PFI_AI_SERVICE_URL: http://ai:8000
      PFI_AI_AUTH_MODE: none
      PFI_AI_PRIVATE_REQUIRED: "false"
      PFI_AI_TIMEOUT_SECONDS: ${FINAL_E2E_AI_TIMEOUT_SECONDS:-180}
      PFI_AI_SERVICE_MULTIPLANAR_CONTRACT_VERSION: v2
      PFI_AUTH_JWT_SECRET: ${FINAL_E2E_JWT_SECRET:-change-me-final-e2e-jwt-secret}
      PFI_AUTH_DEMO_ENABLED: "true"
      PFI_CORS_ALLOWED_ORIGINS: ${FINAL_E2E_FRONTEND_PUBLIC_URL:-http://localhost:58188}
      PFI_LLM_ENABLED: "true"
      PFI_LLM_PROVIDER: self-hosted
      PFI_LLM_BASE_URL: http://mock-llm:8001
      PFI_LLM_TIMEOUT_SECONDS: ${FINAL_E2E_LLM_TIMEOUT_SECONDS:-15}
    ports:
      - "${FINAL_E2E_BACKEND_PORT:-58180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/system/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - pfi-final-e2e

  frontend:
    build:
      context: ../PFI_MVPTest_Enzo_Frontend_final_integration
      args:
        VITE_API_BASE_URL: ${FINAL_E2E_BACKEND_PUBLIC_URL:-http://localhost:58180}
    image: pfi-final-e2e-frontend:local
    container_name: pfi-final-e2e-frontend
    environment:
      BACKEND_URL: ${FINAL_E2E_BACKEND_PUBLIC_URL:-http://localhost:58180}
    ports:
      - "${FINAL_E2E_FRONTEND_PORT:-58188}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/env.js >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - pfi-final-e2e

networks:
  pfi-final-e2e:
    name: pfi-final-e2e

volumes:
  pfi-final-e2e-postgres-data:
    name: pfi-final-e2e-postgres-data
  pfi-final-e2e-ai-outputs:
    name: pfi-final-e2e-ai-outputs
