services:
  postgres:
    image: postgres:16-alpine
    container_name: pfi-post-e50-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pfi_backend}
      POSTGRES_USER: ${POSTGRES_USER:-pfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POST_E50_POSTGRES_PORT:-54339}:5432"
    volumes:
      - post-e50-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pfi-post-e50

  mock-ai:
    build:
      context: ./docker/post-e50-mocks
    container_name: pfi-post-e50-mock-ai
    command: ["node", "mock-ai.mjs"]
    environment:
      PORT: 8000
    ports:
      - "${POST_E50_MOCK_AI_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - pfi-post-e50

  mock-llm:
    build:
      context: ./docker/post-e50-mocks
    container_name: pfi-post-e50-mock-llm
    command: ["node", "mock-llm.mjs"]
    environment:
      PORT: 8001
      # normal | error | timeout -- see docker/post-e50-mocks/mock-llm.mjs (81-S timeout audit).
      MOCK_LLM_MODE: ${POST_E50_MOCK_LLM_MODE:-normal}
    ports:
      - "${POST_E50_MOCK_LLM_PORT:-8101}:8001"
    networks:
      - pfi-post-e50

  backend:
    build:
      context: .
    container_name: pfi-post-e50-backend
    environment:
      PORT: 8080
      PFI_PERSISTENCE_MODE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pfi_backend}?user=${POSTGRES_USER:-pfi}&password=${POSTGRES_PASSWORD:-change-me-local-only}
      PFI_AI_SERVICE_URL: http://mock-ai:8000
      PFI_AI_TIMEOUT_SECONDS: ${PFI_AI_TIMEOUT_SECONDS:-30}
      PFI_AI_SERVICE_MULTIPLANAR_CONTRACT_VERSION: ${PFI_AI_SERVICE_MULTIPLANAR_CONTRACT_VERSION:-v2}
      PFI_AUTH_JWT_SECRET: ${PFI_AUTH_JWT_SECRET:-change-me-local-jwt-secret}
      # Post-E50 dev/E2E stack only: mints a scoped demo ADMIN/DOCTOR/REVIEWER token. The frozen
      # demo stack and any production deployment must keep this false.
      PFI_AUTH_DEMO_ENABLED: ${PFI_AUTH_DEMO_ENABLED:-true}
      PFI_CORS_ALLOWED_ORIGINS: ${PFI_CORS_ALLOWED_ORIGINS:-http://localhost:8188}
      PFI_LLM_ENABLED: ${PFI_LLM_ENABLED:-true}
      PFI_LLM_PROVIDER: self-hosted
      PFI_LLM_BASE_URL: http://mock-llm:8001
      PFI_LLM_TIMEOUT_SECONDS: ${PFI_LLM_TIMEOUT_SECONDS:-15}
    ports:
      - "${POST_E50_BACKEND_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-ai:
        condition: service_healthy
      mock-llm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/system/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - pfi-post-e50

  frontend:
    build:
      context: ../PFI_MVPTest_Enzo_Frontend
      args:
        VITE_API_BASE_URL: ${POST_E50_BACKEND_PUBLIC_URL:-http://localhost:8180}
    container_name: pfi-post-e50-frontend
    environment:
      BACKEND_URL: ${POST_E50_BACKEND_PUBLIC_URL:-http://localhost:8180}
    ports:
      - "${POST_E50_FRONTEND_PORT:-8188}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/env.js >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - pfi-post-e50

networks:
  pfi-post-e50:
    name: pfi-post-e50

volumes:
  post-e50-postgres-data:
