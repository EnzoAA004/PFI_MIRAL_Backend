apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pfi-llm-qwen-e2e
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/gpu-zonal-redundancy-disabled: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/network-interfaces: '[{"network":"pfi-qwen-vpc","subnetwork":"pfi-qwen-us-central1"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      containerConcurrency: 1
      timeoutSeconds: 3600
      serviceAccountName: pfi-llm-runtime@pfi-asplanatti-fabrello-v1.iam.gserviceaccount.com
      nodeSelector:
        run.googleapis.com/accelerator: nvidia-l4
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai@sha256:a4a4c0437bf7240089da5f08aa370c4aee17ae5290f7a3b468825ee26c4c3a6b
          args:
            - serve
            - /models/qwen
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --served-model-name
            - Qwen2.5-7B-Instruct
            - --dtype
            - auto
            - --max-model-len
            - "8192"
            - --no-enable-log-requests
            - --disable-uvicorn-access-log
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 1
            failureThreshold: 1800
          volumeMounts:
            - name: qwen-snapshot
              mountPath: /models/qwen
      volumes:
        - name: qwen-snapshot
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: pfi-qwen-models-810538429027
              mountOptions: only-dir=conversational/qwen2.5-7b-instruct/a09a35458c702b33eeacc393d103063234e8bc28
